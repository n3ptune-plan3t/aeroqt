name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -v

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Preview smoke test (offscreen)
        run: QT_QPA_PLATFORM=offscreen ./build/aeroqt-preview /tmp/preview.png --page=1 && ls -lh /tmp/preview.png

      - name: Package binary
        run: |
          mkdir -p dist
          cp build/libaeroqt.so build/aeroqt-preview build/aeroqt-animtest dist/ 2>/dev/null || cp build/*.so dist/
          cp -r qml themes tools/aeroqt-env.sh dist/
          cp CMakeLists.txt HANDOFF.md dist/ 2>/dev/null || true
          tar -czf aeroqt-linux-x86_64.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aeroqt-linux-x86_64
          path: aeroqt-linux-x86_64.tar.gz

      - name: Release binary (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: aeroqt-linux-x86_64.tar.gz
          generate_release_notes: true
