name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -v

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Preview smoke test (offscreen)
        run: QT_QPA_PLATFORM=offscreen ./build/aeroqt-preview /tmp/preview.png --page=1 && ls -lh /tmp/preview.png

      - name: Package binary (aeroqt-<version>.tar.gz)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -n "$VERSION" ] && [ "$VERSION" != "main" ] || VERSION="0.1.0"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp build/libaeroqt.so build/aeroqt-preview build/aeroqt-animtest dist/ 2>/dev/null || cp build/*.so dist/
          cp -r qml themes tools/aeroqt-env.sh dist/
          cp CMakeLists.txt HANDOFF.md dist/ 2>/dev/null || true
          tar -czf "aeroqt-${VERSION}.tar.gz" -C dist .
          ls -lh "aeroqt-${VERSION}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aeroqt-${{ env.VERSION }}
          path: aeroqt-${{ env.VERSION }}.tar.gz

      - name: Release binary (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: aeroqt-${{ env.VERSION }}.tar.gz
          name: AeroQt ${{ github.ref_name }}
          body: |
            Qt6 Frutiger Aero widget style (phases 1-8) + QQC2 style for Kirigami/QML KDE apps.
            Binary tarball: libaeroqt.so, aeroqt-preview, aeroqt-animtest, qml style, themes.
            Enable: install plugin to <libdir>/qt6/plugins/styles/, QML style to <libdir>/qt6/qml/QtQuick/Controls/,
            source tools/aeroqt-env.sh (QT_STYLE_OVERRIDE=aeroqt, QT_QUICK_CONTROLS_STYLE=AeroQt). GTK excluded.
